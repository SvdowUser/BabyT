name: BabyT Robinhood Mainnet Preflight

on:
  push:
    branches:
      - babyt-robinhood-mainnet-preflight
    paths:
      - 'bridge-mainnet/**'
      - '.github/workflows/babyt-robinhood-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evm-contract-preflight:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bridge-mainnet
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: bridge-mainnet/package.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Compile BabyTOFT
        run: npm run compile

      - name: Run five safety tests
        run: npm test
