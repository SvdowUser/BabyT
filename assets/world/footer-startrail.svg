<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 760" role="img" aria-label="Decorative blue fantasy star trail">
  <defs>
    <radialGradient id="orb" cx="50%" cy="45%" r="58%">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".98"/>
      <stop offset=".18" stop-color="#d9fbff" stop-opacity=".95"/>
      <stop offset=".55" stop-color="#82dcff" stop-opacity=".78"/>
      <stop offset="1" stop-color="#3b8fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="star" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#f8ffff"/>
      <stop offset=".45" stop-color="#bdefff"/>
      <stop offset="1" stop-color="#63baff"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-120%" y="-120%" width="340%" height="340%"><feGaussianBlur stdDeviation="9"/></filter>
    <symbol id="spark" viewBox="-20 -20 40 40"><path d="M0-18 4-5 18 0 4 5 0 18-4 5-18 0-4-5Z" fill="url(#star)"/></symbol>
    <symbol id="diamond" viewBox="-22 -22 44 44"><path d="M0-21 7-7 21 0 7 7 0 21-7 7-21 0-7-7Z" fill="url(#star)"/><circle r="4" fill="#fff"/></symbol>
  </defs>

  <g opacity=".82" filter="url(#soft)" fill="#52c9ff">
    <circle cx="150" cy="85" r="30"/><circle cx="202" cy="162" r="24"/><circle cx="166" cy="259" r="28"/>
    <circle cx="233" cy="355" r="32"/><circle cx="184" cy="466" r="26"/><circle cx="254" cy="565" r="30"/>
    <circle cx="214" cy="664" r="25"/>
  </g>

  <g filter="url(#glow)">
    <g opacity=".95">
      <circle cx="118" cy="38" r="4" fill="#c9f7ff"/><circle cx="146" cy="55" r="7" fill="url(#orb)"/><circle cx="170" cy="77" r="13" fill="url(#orb)"/>
      <use href="#spark" x="126" y="97" width="26" height="26"/><circle cx="194" cy="106" r="5" fill="#dffbff"/><circle cx="154" cy="121" r="8" fill="url(#orb)"/>
      <use href="#diamond" x="190" y="126" width="34" height="34"/><circle cx="214" cy="151" r="10" fill="url(#orb)"/><circle cx="172" cy="159" r="4" fill="#fff"/>
      <circle cx="226" cy="177" r="5" fill="#c8f5ff"/><use href="#spark" x="174" y="181" width="24" height="24"/>
      <circle cx="142" cy="197" r="7" fill="url(#orb)"/><circle cx="198" cy="208" r="11" fill="url(#orb)"/><use href="#spark" x="218" y="210" width="18" height="18"/>
    </g>

    <g opacity=".92">
      <circle cx="136" cy="236" r="6" fill="#dffbff"/><use href="#spark" x="158" y="230" width="28" height="28"/>
      <circle cx="192" cy="246" r="11" fill="url(#orb)"/><circle cx="222" cy="257" r="6" fill="#fff"/><circle cx="150" cy="273" r="8" fill="url(#orb)"/>
      <use href="#diamond" x="196" y="272" width="42" height="42"/><circle cx="244" cy="295" r="12" fill="url(#orb)"/><circle cx="164" cy="310" r="5" fill="#d9fbff"/>
      <circle cx="208" cy="320" r="7" fill="url(#orb)"/><use href="#spark" x="229" y="326" width="24" height="24"/><circle cx="178" cy="342" r="4" fill="#fff"/>
      <circle cx="258" cy="349" r="8" fill="url(#orb)"/>
    </g>

    <g opacity=".9">
      <circle cx="214" cy="382" r="13" fill="url(#orb)"/><use href="#spark" x="174" y="381" width="32" height="32"/><circle cx="251" cy="401" r="6" fill="#dffbff"/>
      <use href="#diamond" x="218" y="406" width="46" height="46"/><circle cx="187" cy="425" r="7" fill="url(#orb)"/><circle cx="276" cy="438" r="10" fill="url(#orb)"/>
      <circle cx="226" cy="455" r="5" fill="#fff"/><use href="#spark" x="189" y="458" width="22" height="22"/><circle cx="254" cy="478" r="12" fill="url(#orb)"/>
      <circle cx="204" cy="490" r="6" fill="#c9f7ff"/>
    </g>

    <g opacity=".88">
      <use href="#spark" x="235" y="508" width="24" height="24"/><circle cx="190" cy="526" r="9" fill="url(#orb)"/><circle cx="266" cy="532" r="6" fill="#fff"/>
      <use href="#diamond" x="203" y="544" width="38" height="38"/><circle cx="246" cy="556" r="12" fill="url(#orb)"/><circle cx="176" cy="572" r="5" fill="#dffbff"/>
      <circle cx="226" cy="586" r="7" fill="url(#orb)"/><use href="#spark" x="252" y="590" width="28" height="28"/><circle cx="198" cy="610" r="10" fill="url(#orb)"/>
      <circle cx="271" cy="623" r="5" fill="#fff"/>
    </g>

    <g opacity=".85">
      <circle cx="213" cy="648" r="12" fill="url(#orb)"/><use href="#spark" x="248" y="642" width="22" height="22"/><circle cx="181" cy="668" r="6" fill="#dffbff"/>
      <use href="#diamond" x="206" y="675" width="44" height="44"/><circle cx="257" cy="690" r="10" fill="url(#orb)"/><circle cx="226" cy="716" r="5" fill="#fff"/>
      <use href="#spark" x="270" y="713" width="20" height="20"/><circle cx="192" cy="731" r="7" fill="url(#orb)"/><circle cx="290" cy="742" r="4" fill="#cff7ff"/>
    </g>
  </g>
</svg>