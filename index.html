  <style>
    .world-panorama .panorama-caption,
    .world-community > .world-kicker{display:none!important;visibility:hidden!important;opacity:0!important}
    .work-row-track{animation-duration:62.4s!important}
    @media(max-width:1000px){.work-row-track{animation-duration:68.8s!important}}
    @media(max-width:680px){.work-row-track{animation-duration:75.2s!important}}
    /* Inline token palette override: keeps the new palette even if an older external CSS file is cached. */
    .world-home .world-panorama .token-callout-title{color:#86d5f5!important}
    .world-home .world-panorama .token-callout-title .token-symbol{color:#f7f4ee!important}
    .world-home .world-panorama .token-callout-copy{color:#b2dcf0!important}
    .world-home .world-panorama .token-dex-link{background:linear-gradient(180deg,#4c9cf4 0%,#3289e0 100%)!important;border-color:#86d5f5!important;color:#f8faff!important;box-shadow:0 8px 18px rgba(5,12,46,.16),inset 0 1px 0 rgba(255,255,255,.18)!important}
    .world-home .world-panorama .token-dex-link::before{border-color:rgba(255,255,255,.14)!important}
    .world-home .world-panorama .token-dex-link:hover{background:linear-gradient(180deg,#54a9f7 0%,#3794ea 100%)!important;border-color:#97e0ff!important}
    /* Force opaque secondary social buttons even if an older stylesheet is cached. */
    .world-home .world-community .community-social-block .community-links>a{height:48px!important;min-height:48px!important;border:1px solid rgba(134,213,245,.78)!important;border-radius:15px!important;background:linear-gradient(180deg,#4c9cf4 0%,#3289e0 100%)!important;box-shadow:0 8px 18px rgba(5,12,46,.14),inset 0 1px 0 rgba(255,255,255,.18)!important}
    .world-home .world-community .community-social-block .community-links>a::before{content:""!important;display:block!important;position:absolute!important;inset:3px!important;border:1px solid rgba(255,255,255,.14)!important;border-radius:11px!important;pointer-events:none!important}
    .world-home .world-community .community-social-block .community-links>a::after{content:none!important;display:none!important}
    .world-home .world-community .community-social-block .community-links>a:hover{background:linear-gradient(180deg,#54a9f7 0%,#3794ea 100%)!important;border-color:rgba(151,224,255,.96)!important;box-shadow:0 10px 22px rgba(5,12,46,.18),0 0 0 1px rgba(134,213,245,.06),inset 0 1px 0 rgba(255,255,255,.22)!important;transform:translateY(-1px)!important}
    /* Mobile must stay visibly more compact than desktop; these rules sit after the
       generic fallback above so an inline fallback cannot enlarge the buttons again. */
    @media(max-width:760px){
      .world-home .world-community .community-social-block{width:min(76vw,420px)!important}
      .world-home .world-community .community-social-block .community-links>a{height:36px!important;min-height:36px!important;border-radius:11px!important}
      .world-home .world-community .community-social-block .community-links>a::before{inset:2px!important;border-radius:8px!important}
    }
    /* iPhone Safari can leave a 1–2px compositing seam beside the hero video.
       Make the first section truly edge-to-edge and slightly overscan only its media layers. */
    @media(max-width:760px){
      html,body.world-home{margin:0!important;padding:0!important;max-width:100%!important}
      body.world-home main>.portal-hero{
        width:100vw!important;
        max-width:none!important;
        margin-left:calc(50% - 50vw)!important;
        margin-right:calc(50% - 50vw)!important;
      }
      body.world-home main>.portal-hero>.portal-hero-bg,
      body.world-home main>.portal-hero>.portal-hero-video,
      body.world-home main>.portal-hero::after,
      body.world-home main>.portal-hero>.hero-noise{
        inset:0 -2px!important;
        width:auto!important;
        max-width:none!important;
      }
    }
